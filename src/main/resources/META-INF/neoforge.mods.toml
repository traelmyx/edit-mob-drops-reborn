modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/traelmyx/edit-mob-drops-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "Edit Mob Drops Reborn"
authors = "traelmyx, Powerthegreat"
${logo_key} = "assets/editmobdrops/icon.png"
displayTest = "IGNORE_SERVER_VERSION"
description = '''Add drops to every mob, to monsters, bosses or groups of mobs, or clear a mob's drops, from a config file. Based on Edit Mob Drops by Powerthegreat.'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
